pcm.jibri_loopback {
    type hw
    card Loopback
    device 1
    subdevice 0
}

pcm.bsnoop {
    type dsnoop
    ipc_key 816357492
    ipc_key_add_uid 0
    ipc_perm 0666
    slave {
        pcm "jibri_loopback"
        rate 44100
        channels 2
        period_size 1024
        buffer_size 8192
    }
    bindings {
        0 0
        1 1
    }
}
